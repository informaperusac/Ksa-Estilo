<!doctype html>
<html lang="es-PE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ksa Estilo | Muebles & Diseño Interior</title>
    <meta
      name="description"
      content="Ksa Estilo: muebles y diseño interior. Explora piezas para sala, dormitorio, comedor, cocina y oficina, y solicita una cotización por WhatsApp."
    />
    <meta name="theme-color" content="#F5F1EA" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />

    <!-- Open Graph / redes sociales -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_PE" />
    <meta property="og:site_name" content="Ksa Estilo" />
    <meta property="og:title" content="Ksa Estilo | Muebles & Diseño Interior" />
    <meta
      property="og:description"
      content="Espacios que inspiran. Diseños que enamoran. Muebles y diseño interior para cada ambiente."
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sala moderna con sofá gris y mesa de centro de madera" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Manrope:wght@400..700&display=swap"
    />

    <!-- Imagen del hero: se precarga solo en el inicio para acelerar el primer render -->
    <script>
      if (['', '#', '#/'].includes(location.hash) && location.pathname === '%BASE_URL%') {
        var hero = document.createElement('link');
        hero.rel = 'preload';
        hero.as = 'image';
        hero.type = 'image/webp';
        hero.href = '%BASE_URL%images/hero-sala-2400.webp';
        hero.setAttribute('imagesrcset', '%BASE_URL%images/hero-sala-960.webp 960w, %BASE_URL%images/hero-sala-1600.webp 1600w, %BASE_URL%images/hero-sala-2400.webp 2400w');
        hero.setAttribute('imagesizes', '100vw');
        hero.setAttribute('fetchpriority', 'high');
        document.head.appendChild(hero);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 24px; font-family: sans-serif">
        Ksa Estilo — Muebles &amp; Diseño Interior. Activa JavaScript para ver el sitio completo.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
