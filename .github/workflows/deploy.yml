name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SITE_URL: https://informaperusac.github.io/Ksa-Estilo
          VITE_WHATSAPP_NUMBER: ${{ vars.VITE_WHATSAPP_NUMBER }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
          VITE_CONTACT_PHONE: ${{ vars.VITE_CONTACT_PHONE }}
          VITE_ADDRESS: ${{ vars.VITE_ADDRESS }}
          VITE_BUSINESS_HOURS: ${{ vars.VITE_BUSINESS_HOURS }}
          VITE_MAP_EMBED_URL: ${{ vars.VITE_MAP_EMBED_URL }}
          VITE_INSTAGRAM_URL: ${{ vars.VITE_INSTAGRAM_URL }}
          VITE_FACEBOOK_URL: ${{ vars.VITE_FACEBOOK_URL }}
          VITE_TIKTOK_URL: ${{ vars.VITE_TIKTOK_URL }}
          VITE_PINTEREST_URL: ${{ vars.VITE_PINTEREST_URL }}
          VITE_ALUQIS_URL: ${{ vars.VITE_ALUQIS_URL }}
          VITE_DEMO_MODE: ${{ vars.VITE_DEMO_MODE }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
